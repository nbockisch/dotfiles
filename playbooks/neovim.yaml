- name: Configure Neovim
  hosts: neovim
  become: true
  tasks:
    - name: Install Arch Neovim Setup Dependencies
      community.general.pacman:
        name:
          - bash-language-server
          - bat
          - ccls
          - deno
          - fzf
          - git
          - go
          - gopls
          - lua-language-server
          - npm
          - pyright
          - rust-analyzer
          - rustup
          - svelte-language-server
          - tailwindcss-language-server
          - tree-sitter
          - tree-sitter-bash
          - tree-sitter-c
          - tree-sitter-lua
          - tree-sitter-python
          - tree-sitter-rust
          - typescript-language-server
          - vscode-css-languageserver
          - vscode-html-languageserver
        state: present
      when: ansible_facts['distribution'] == 'Archlinux'

    - name: Install Arch AUR Packages
      kewlfft.aur.aur:
        name:
          # - java-language-server
          # - tree-sitter-java
          - docker-language-server
          - tree-sitter-css
          - tree-sitter-go
          - tree-sitter-html
          - tree-sitter-json
          - tree-sitter-make
          - tree-sitter-sql
          - tree-sitter-svelte
          - tree-sitter-yaml
        use: paru
        state: present
      become: yes
      become_user: aur_builder
      when: ansible_facts['distribution'] == 'Archlinux'

    - name: Set Default Cargo Version
      ansible.builtin.shell: 'rustup default stable'

    # Cargo always appends /bin to the install path, so the path is /usr/bin
    - name: Install Cargo Packages
      community.general.cargo:
        name: vhdl_ls
        path: /usr
        state: latest

    - name: Make the Library Path for vhdl_ls
      ansible.builtin.file:
        path: /usr/lib/rust_hdl
        state: directory
        owner: root
        group: root

    - name: Copy vhdl_ls Libraries
      ansible.builtin.copy:
        src: '{{ playbook_dir }}/../files/neovim/vhdl_libraries'
        dest: '/usr/lib/rust_hdl/'
        owner: root
        group: root

    - name: Apply Neovim Config
      ansible.builtin.shell: 'stow --target=${HOME} neovim'
      args:
        chdir: '{{ playbook_dir }}/../dotfiles'
      become: yes
      become_user: '{{ user }}'

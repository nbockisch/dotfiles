- name: Install Arch packages
  community.general.pacman:
    name:
      - neovim
    state: present
  when: ansible_facts['distribution'] == 'Archlinux'

- name: Apply Neovim config
  ansible.builtin.shell: 'stow --target=${HOME} neovim'
  args:
    chdir: '{{ playbook_dir }}/../dotfiles'
  become: true
  become_user: '{{ user }}'

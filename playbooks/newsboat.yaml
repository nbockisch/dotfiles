- name: Configure Newsboat
  hosts: newsboat
  become: true
  tasks:
    - name: Install Arch Packages
      community.general.pacman:
        name: newsboat
        state: present
      when: ansible_facts['distribution'] == 'Archlinux'

    - name: Apply Newsboat Config
      ansible.builtin.shell: 'stow --target=${HOME} newsboat'
      args:
        chdir: '{{ playbook_dir }}/../dotfiles'
      become: true
      become_user: '{{ user }}'

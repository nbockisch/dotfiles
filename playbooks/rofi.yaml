- name: Configure Rofi
  hosts: rofi
  become: true
  tasks:
    - name: Install Arch Packages
      community.general.pacman:
        name: rofi
        state: present
      when: ansible_facts['distribution'] == 'Archlinux'

    - name: Apply Rofi Config
      ansible.builtin.shell: 'stow --target=${HOME} rofi'
      args:
        chdir: '{{ playbook_dir }}/../dotfiles'
      become: true
      become_user: '{{ user }}'

- name: Install Arch packages
  community.general.pacman:
    name: tmux
    state: present
  when: ansible_facts['distribution'] == 'Archlinux'

- name: Apply Tmux config
  ansible.builtin.shell: 'stow --target=${HOME} tmux'
  args:
    chdir: '{{ playbook_dir }}/../dotfiles'
  become: true
  become_user: '{{ user }}'
